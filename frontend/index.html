<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sad Hammer — Frontend</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/axios/dist/axios.min.js"
    ></script>
    <!-- Tailwind CDN for rapid prototyping -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
      .pane { display: inline-block; vertical-align: top; }
      #units { width: 320px; height: 480px; overflow: auto; }
      #log { width: 560px; height: 480px; overflow: auto; margin-left: 12px; }
      button { margin: 4px; }
    </style>
  </head>
  <body>
    <header class="max-w-4xl mx-auto p-4">
      <h1 class="text-2xl font-semibold">Sad Hammer — Frontend</h1>
      <p class="text-sm text-gray-600">Upload an opponent roster and let the AI take its turn. Choose who resolves AI rolls.</p>
    </header>
    <main class="max-w-4xl mx-auto p-4">
      <div class="flex items-center gap-3">
        <input id="file" type="file" class="" />
        <label class="ml-2 inline-flex items-center text-sm">
          <span class="mr-2">AI roll handling:</span>
          <select id="roll-mode" class="border rounded px-2 py-1">
            <option value="ai">AI handles rolls</option>
            <option value="player">Player handles AI rolls</option>
          </select>
        </label>
        <button id="create-session" class="ml-3 bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">Upload & Start Session</button>
        <span class="ml-auto text-sm">Session ID: <span id="session-id" class="font-mono text-sm">(none)</span></span>
      </div>
    </main>
    <div style="margin-top:8px">
      <button id="fetch-state">Get Session State</button>
      <button id="ai-turn">Run AI Turn</button>
    </div>
    <div style="margin-top:8px">
      <strong>Session Log Viewer:</strong>
      <div id="log-controls" style="margin-top:6px">
        Page: <span id="log-page">1</span>
        <button id="log-prev">Prev</button>
        <button id="log-next">Next</button>
        Size: <input id="log-size" type="number" value="20" min="1" style="width:60px" />
        <button id="fetch-log">View Log</button>
      </div>
      <label style="margin-left:12px"><input id="compact-toggle" type="checkbox" checked /> Compact view</label>
      <div id="log-items" style="width:920px;border:1px solid #eee;padding:8px;margin-top:6px;max-height:260px;overflow:auto;white-space:pre-wrap;background:#fff"></div>
    </div>
    <div class="max-w-4xl mx-auto p-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div id="units" class="col-span-1 border rounded p-3 bg-white shadow-sm"></div>
        <div id="log" class="col-span-2 border rounded p-3 bg-white shadow-sm"></div>
      </div>
    </div>
    <div class="max-w-4xl mx-auto p-4">
      <div id="pending-rolls" class="hidden border-2 border-dashed border-gray-200 rounded p-4 bg-yellow-50">
        <h2 class="font-medium">Pending roll requests</h2>
        <p class="text-sm text-gray-600">Enter die values (single number or comma-separated for multiple dice). Valid d6 values: 1–6.</p>
        <div id="pending-list" class="mt-3 space-y-2"></div>
        <div class="mt-3 flex items-center gap-3">
          <button id="submit-rolls" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">Submit Rolls</button>
          <div id="roll-errors" class="text-red-600 text-sm" role="alert" aria-live="polite"></div>
        </div>
      </div>
    </div>
    <div style="margin-top:8px">
      <textarea id="notes" placeholder="Player notes (free-form)" style="width:920px;height:80px"></textarea>
      <br/>
      <button id="submit-note">Save Note</button>
      <button id="fetch-notes">Get Notes</button>
      <div id="notes-list" style="width:920px;border:1px solid #eee;padding:8px;margin-top:6px;max-height:140px;overflow:auto"></div>
    </div>
    <script>
      const api = {
        createSessionFromFile: (file, rollMode = 'ai') => {
          const fd = new FormData();
          fd.append("file", file);
          fd.append("roll_mode", rollMode);
          return axios.post("/api/session", fd, { headers: { "Content-Type": "multipart/form-data" } }).then((r) => r.data);
        },
        createSessionFromUnits: (units, rollMode = 'ai') => {
          return axios.post("/api/session", { units, roll_mode: rollMode }).then((r) => r.data);
        },
  getSession: (id) => axios.get(`/api/session/${id}`).then((r) => r.data),
  postAiTurn: (id) => axios.post(`/api/session/${id}/ai_turn`).then((r) => r.data),
  postResolveRolls: (id, payload) => axios.post(`/api/session/${id}/resolve_rolls`, payload).then((r) => r.data),
      };

      const unitsEl = document.getElementById("units");
      const logEl = document.getElementById("log");
      const fileInput = document.getElementById("file");
      const sessionIdEl = document.getElementById("session-id");

      let currentSession = null;

      document.getElementById("create-session").addEventListener("click", () => {
        const f = fileInput.files[0];
        if (!f) {
          alert("Choose an HTML roster first");
          return;
        }
        const rollMode = document.getElementById('roll-mode')?.value || 'ai';
        api
          .createSessionFromFile(f, rollMode)
          .then((data) => {
            currentSession = data.session_id;
            sessionIdEl.textContent = currentSession;
            logEl.innerHTML += `Created session ${currentSession}\n`;
            // show selected roll mode in UI
            const mode = data.state?.roll_mode || rollMode || 'ai';
            logEl.innerHTML += `Roll handling: ${mode}\n`;
          })
          .catch((e) => alert("Failed to create session: " + (e.response?.data?.error || e.message)));
      });

      document.getElementById("fetch-state").addEventListener("click", () => {
        if (!currentSession) return alert('No session. Create one first.');
        api.getSession(currentSession).then((data) => {
          unitsEl.innerHTML = '';
          // show AI profiles (full parsed roster) when available
          const profiles = data.ai_profiles || [];
          if (profiles.length === 0) {
            // fallback to ai_units summary
            (data.ai_units || []).forEach(u => {
              const d = document.createElement('div');
              d.textContent = `${u.name} — ${u.aggression || ''}`;
              unitsEl.appendChild(d);
            });
          } else {
              profiles.forEach(u => {
                const d = document.createElement('div');
                let kw = '';
                if (u.keywords && u.keywords.length) kw = ' - ' + u.keywords.join(', ');
                let html = `<strong>${u.name}</strong> ${kw}<br/>Wounds: ${u.wounds_per_model || '?'} Attacks: ${u.attacks || '?'} `;
                if (u.weapons && u.weapons.length) {
                  html += '<br/><em>Weapons:</em><ul>' + u.weapons.map(w => `<li>${w.name || w.title || 'weapon'} — dmg:${(w.damage && (w.damage.type==='D')?('D'+w.damage.sides):w.damage) || ''} to_hit:${w.to_hit||''} to_wound:${w.to_wound||''}</li>`).join('') + '</ul>';
                }
                d.innerHTML = html;
                unitsEl.appendChild(d);
              });
          }
          logEl.innerHTML += `Fetched session state (turn ${data.turn})\n`;
          if (data.roll_mode) {
            logEl.innerHTML += `Roll handling: ${data.roll_mode}\n`;
          }
          (data.log || []).forEach(e => logEl.innerHTML += (e.text || JSON.stringify(e)) + '\n');
        }).catch(e => alert('Failed to fetch session: ' + (e.response?.data?.error || e.message)));
      });

      document.getElementById('ai-turn').addEventListener('click', () => {
        if (!currentSession) return alert('No session. Create one first.');
        api.postAiTurn(currentSession).then(resp => {
            // server returns plain text summary; render it as a separate pre block
            const text = resp.data || resp;
            const pre = document.createElement('pre');
            pre.style.background = '#fafafa';
            pre.style.border = '1px solid #eee';
            pre.style.padding = '8px';
            pre.style.marginTop = '8px';
            pre.style.whiteSpace = 'pre-wrap';
            pre.textContent = (typeof text === 'string' ? text : JSON.stringify(text, null, 2));
            logEl.appendChild(pre);
            // keep scroll at bottom
            logEl.scrollTop = logEl.scrollHeight;
            // Try to fetch last_turn structured events to detect roll_request
            axios.get(`/api/session/${currentSession}/last_turn`).then(r => {
              const events = r.data.events || [];
              const rr = events.find(e => e.event === 'roll_request');
              if (rr) {
                  const list = document.getElementById('pending-list');
                  list.innerHTML = '';
                  rr.pending_actions.forEach((a, idx) => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center gap-3 bg-white p-2 rounded shadow-sm';
                    const id = `req-${a.request_id}`;
                    row.innerHTML = `
                      <div class="flex-1">
                        <div class="font-medium">${a.unit}</div>
                        <div class="text-sm text-gray-600">${a.card_title} <span class="ml-2 text-xs">(req=${a.request_id})</span></div>
                      </div>
                      <div class="w-48">
                        <label for="${id}" class="sr-only">Enter rolls for ${a.unit}</label>
                        <input id="${id}" data-req="${a.request_id}" class="roll-input border rounded px-2 py-1 w-full" placeholder="e.g. 4 or 3,2" aria-describedby="err-${id}" />
                        <div id="err-${id}" class="text-red-600 text-xs mt-1" aria-live="polite"></div>
                      </div>
                    `;
                    list.appendChild(row);
                  });
                  document.getElementById('pending-rolls').classList.remove('hidden');
                }
            }).catch(() => {});
          }).catch(e => {
            const msg = e.response?.data || e.message;
            alert('AI turn failed: ' + (typeof msg === 'string' ? msg : (msg?.error || JSON.stringify(msg))));
          });
      });

        document.getElementById('submit-rolls').addEventListener('click', () => {
        document.getElementById('roll-errors').textContent = '';
        const inputs = Array.from(document.querySelectorAll('.roll-input'));
        const payload = { action_results: [] };
        let hasClientError = false;
        inputs.forEach(inp => {
          const rid = inp.getAttribute('data-req');
          const errEl = document.getElementById(`err-${inp.id}`);
          errEl.textContent = '';
          const raw = inp.value || '';
          if (!raw.trim()) {
            errEl.textContent = 'Please enter at least one roll (1-6)';
            hasClientError = true;
            return;
          }
          const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
          const nums = parts.map(p => parseInt(p, 10));
          // client-side validation: ensure numbers and in 1..6
          if (nums.some(n => Number.isNaN(n))) {
            errEl.textContent = 'Invalid number';
            hasClientError = true;
            return;
          }
          if (nums.some(n => n < 1 || n > 6)) {
            errEl.textContent = 'Rolls must be 1-6';
            hasClientError = true;
            return;
          }
          const resultObj = {};
          if (nums.length === 1) resultObj.roll = nums[0];
          else resultObj.roll = nums;
          payload.action_results.push({ request_id: rid, result: resultObj });
        });

        if (hasClientError) {
          document.getElementById('roll-errors').textContent = 'Fix input errors above before submitting.';
          return;
        }

        api.postResolveRolls(currentSession, payload).then(resp => {
          // hide pending UI and show returned events
          document.getElementById('pending-rolls').classList.add('hidden');
          const evpre = document.createElement('pre');
          evpre.className = 'bg-green-50 border border-green-200 p-3 rounded mt-3';
          evpre.textContent = JSON.stringify(resp.events || [], null, 2);
          logEl.appendChild(evpre);
        }).catch(err => {
          const data = err.response?.data || err.message;
          document.getElementById('roll-errors').textContent = (data?.error || JSON.stringify(data));
        });
      });

        document.getElementById('submit-note').addEventListener('click', () => {
          if (!currentSession) return alert('No session');
          const txt = document.getElementById('notes').value || '';
          if (!txt) return alert('Note empty');
          axios.post(`/api/session/${currentSession}/notes`, { text: txt }).then(r => {
            logEl.innerHTML += `Saved note\n`;
            document.getElementById('notes').value = '';
          }).catch(e => alert('Failed to save note: ' + (e.response?.data?.error || e.message)));
        });

        document.getElementById('fetch-notes').addEventListener('click', () => {
          if (!currentSession) return alert('No session');
          axios.get(`/api/session/${currentSession}/notes`).then(r => {
            const list = document.getElementById('notes-list');
            list.innerHTML = '';
            (r.data.notes || []).forEach(n => { const d = document.createElement('div'); d.textContent = n.text; list.appendChild(d); });
          }).catch(e => alert('Failed to fetch notes: ' + (e.response?.data?.error || e.message)));
        });

        // Session log viewer state
        let logPage = 1;

        document.getElementById('fetch-log').addEventListener('click', () => {
          if (!currentSession) return alert('No session');
          const size = parseInt(document.getElementById('log-size').value) || 20;
          axios.get(`/api/session/${currentSession}/log?page=${logPage}&size=${size}`).then(r => {
            const items = r.data.items || [];
            const container = document.getElementById('log-items');
            container.innerHTML = '';
              const compact = document.getElementById('compact-toggle')?.checked;
              items.forEach(it => {
                if (compact) {
                  // compact, human readable rendering
                  if (it.event === 'no_tactic_available') {
                    const d = document.createElement('div'); d.textContent = 'No tactic available'; d.style.opacity = '0.8'; d.style.margin='6px 0'; container.appendChild(d); return;
                  }
                  if (it.aggression_check !== undefined) {
                    const act = it.aggression_check ? 'ACT' : 'HOLD';
                    const line = `${it.unit}: ${act} (d6=${it.roll} + mod=${it.modifier} => ${it.total} vs ${it.target})`;
                    const d = document.createElement('div'); d.textContent = line; d.style.margin='4px 0'; container.appendChild(d); return;
                  }
                  if (it.action_resolved) {
                    const a = it.action_resolved;
                    const line = `ACTION: ${a.unit} -> ${a.card_title} (init=${a.initiative}) ${a.behavior || ''}`;
                    const d = document.createElement('div'); d.textContent = line; d.style.fontWeight='600'; d.style.margin='4px 0'; container.appendChild(d); return;
                  }
                  // fallback JSON
                  const pre = document.createElement('pre');
                  pre.style.margin = '4px 0';
                  pre.style.background = '#fafafa';
                  pre.style.border = '1px solid #eee';
                  pre.style.padding = '6px';
                  pre.textContent = JSON.stringify(it, null, 2);
                  container.appendChild(pre);
                } else {
                  const pre = document.createElement('pre');
                  pre.style.margin = '4px 0';
                  pre.style.background = '#fafafa';
                  pre.style.border = '1px solid #eee';
                  pre.style.padding = '6px';
                  pre.textContent = JSON.stringify(it, null, 2);
                  container.appendChild(pre);
                }
              });
            document.getElementById('log-page').textContent = r.data.page || logPage;
          }).catch(e => alert('Failed to fetch log: ' + (e.response?.data?.error || e.message)));
        });

        document.getElementById('log-prev').addEventListener('click', () => {
          if (logPage > 1) { logPage -= 1; document.getElementById('fetch-log').click(); }
        });
        document.getElementById('log-next').addEventListener('click', () => {
          logPage += 1; document.getElementById('fetch-log').click();
        });

      // Composer removed — UI focuses on AI units and AI-turn stepping only.
    </script>
    </script>
  </body>
</html>
