services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sadhammer_backend
    ports:
      - "5001:5000"
    volumes:
      - ./:/app:rw
    develop:
      watch:
        - action: rebuild
          path: ./backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sadhammer_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./frontend
