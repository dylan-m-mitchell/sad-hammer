name: Main CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # Backend Python tests, including the engine contract tests.
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage

  # Formatting and linting. Engine files are also checked in engine-ci.yml,
  # but this keeps the legacy tree from regressing while it is being replaced.
  backend-quality:
    name: Backend Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "black==26.10.1" "ruff==0.17.2" mypy pylint

      - name: Check formatting with Black
        run: |
          black --check backend/ tests/

      - name: Lint with Ruff
        run: |
          ruff check backend/ tests/

      - name: Type check with MyPy
        run: |
          mypy backend/ --ignore-missing-imports
        continue-on-error: true

  # The frontend build is a real gate. Browser tests are not wired up yet;
  # the old Playwright specs still describe the retired player-roll flow.
  frontend-tests:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  # Docker build contexts are the repository root because both Dockerfiles
  # copy files from root (requirements.txt and nginx/).
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: sad-hammer-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: sad-hammer-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The live-server test is opt-in locally, so CI starts the real Flask app.
  integration-check:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Start backend
        run: |
          python -c "from backend.api_server import app; app.run(host='127.0.0.1', port=5000, debug=False)" > /tmp/sadhammer-backend.log 2>&1 &
          echo $! > /tmp/sadhammer-backend.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/battleplans >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sadhammer-backend.log
          exit 1

      - name: Run integration tests
        env:
          RUN_LIVE_TESTS: "1"
          LIVE_BASE: http://127.0.0.1:5000
        run: |
          python -m pytest tests/test_integration_live_server.py -v

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/sadhammer-backend.pid ]; then
            kill "$(cat /tmp/sadhammer-backend.pid)" || true
          fi

  # Deployment is intentionally still a placeholder.
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs:
      [
        backend-tests,
        backend-quality,
        frontend-tests,
        docker-build,
        integration-check,
      ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment placeholder
        run: |
          echo "Deployment steps would run here"
          echo "Configure registry/publishing credentials before enabling deployment"
          echo "SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"

  # Single required status check for branch protection.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        backend-tests,
        backend-quality,
        frontend-tests,
        docker-build,
        integration-check,
      ]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "Backend tests failed"
            exit 1
          fi
          if [ "${{ needs.backend-quality.result }}" != "success" ]; then
            echo "Backend quality checks failed"
            exit 1
          fi
          if [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "Frontend build failed"
            exit 1
          fi
          if [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "Docker build failed"
            exit 1
          fi
          if [ "${{ needs.integration-check.result }}" != "success" ]; then
            echo "Integration check failed"
            exit 1
          fi
          echo "All CI checks passed!"
