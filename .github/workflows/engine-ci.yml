name: Engine CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Engine (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install engine test tools
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<10" "black==26.10.1" "ruff==0.17.2"

      - name: Check formatting
        run: |
          black --check backend/engine tests/engine

      - name: Lint
        run: |
          ruff check backend/engine tests/engine

      - name: Run engine tests
        run: |
          python -m pytest tests/engine -q

      - name: Run CLI smoke test
        run: |
          python -m backend.engine.cli demo --seed 7 --rounds 1 --quiet
